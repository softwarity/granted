# The library's own tests: granted.source=headers (the default) unless a test profile says jwt.
granted.role-hierarchy.ADMIN=MANAGER
granted.role-hierarchy.MANAGER=USER

# smallrye-jwt is on the test classpath for the JWT tests, and wants a key in every profile.
# A key pair made for these tests only: it signs nothing anywhere else.
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.publickey.algorithm=ES256
mp.jwt.verify.issuer=https://idp.test
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.signature-algorithm=ES256
smallrye.jwt.new-token.issuer=https://idp.test
