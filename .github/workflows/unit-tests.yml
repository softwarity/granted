name: Unit tests
run-name: ${{ github.actor }} run unit tests on ${{ github.repository }}

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nestjs:
    name: NestJS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Jest loads the ESM-only NestJS 12 through require(esm): Node 24.9 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
